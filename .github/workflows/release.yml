name: Publicar Selene

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    publicar:
        if: github.ref == 'refs/heads/main'
        runs-on: windows-latest
        timeout-minutes: 30
        env:
            GH_TOKEN: ${{ github.token }}
            CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        steps:
            - name: Obter código
              uses: actions/checkout@v4
            - name: Preparar Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.5'
            - name: Preparar Node para ferramentas do Electron
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - name: Instalar dependências
              run: bun install --frozen-lockfile
            - name: Definir versão da distribuição
              id: versao
              run: bun scripts/versionarRelease.ts
            - name: Verificar tipos
              run: bun run verificar
            - name: Executar testes
              run: bun test
            - name: Gerar instalador
              run: bun run dist:win
            - name: Guardar arquivos da distribuição
              uses: actions/upload-artifact@v4
              with:
                  name: Selene-${{ steps.versao.outputs.valor }}
                  path: |
                      release/*.exe
                      release/*.blockmap
                      release/latest.yml
                  if-no-files-found: error
            - name: Publicar release completa
              env:
                  SELENE_VERSAO: ${{ steps.versao.outputs.valor }}
              run: bun scripts/publicarRelease.ts
